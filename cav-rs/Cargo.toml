[package]
name = "cav"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cav"
path = "src/main.rs"

[[bin]]
name = "cav-git-pre-receive"
path = "src/bin/git_pre_receive.rs"

[[bin]]
name = "cav-git-post-receive"
path = "src/bin/git_post_receive.rs"

[[bin]]
name = "cav-git-daemon"
path = "src/bin/git_daemon.rs"

[[bin]]
name = "cav-supervisor"
path = "src/bin/supervisor.rs"

[[bin]]
name = "cav-git"
path = "src/bin/git_wrapper.rs"

[[bin]]
name = "cav-seccomp-gen"
path = "src/bin/seccomp_gen.rs"

[[bin]]
name = "cav-comms-broker"
path = "src/bin/comms_broker.rs"

[[bin]]
name = "cav-comms-channel-server"
path = "src/bin/comms_channel_server.rs"

[[bin]]
name = "cav-host"
path = "src/bin/cav_host.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rustix = { version = "0.38", features = ["process", "fs", "termios", "pipe", "stdio"] }
rusqlite = { version = "0.32", features = ["backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
rayon = "1"

[dev-dependencies]
libc = "0.2"
rusqlite = { version = "0.32" }
uuid = { version = "1", features = ["v4"] }
