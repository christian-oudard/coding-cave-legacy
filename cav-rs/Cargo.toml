[package]
name = "cav"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cav"
path = "src/main.rs"

[[bin]]
name = "cav-pre-receive"
path = "src/bin/pre_receive.rs"

[[bin]]
name = "cav-post-receive"
path = "src/bin/post_receive.rs"

[[bin]]
name = "cav-handler"
path = "src/bin/handler.rs"

[[bin]]
name = "cav-supervisor"
path = "src/bin/supervisor.rs"

[[bin]]
name = "cav-git"
path = "src/bin/git_wrapper.rs"

[[bin]]
name = "cav-seccomp-gen"
path = "src/bin/seccomp_gen.rs"

[[bin]]
name = "cav-broker"
path = "src/bin/broker.rs"

[[bin]]
name = "cav-channel-server"
path = "src/bin/channel_server.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rustix = { version = "0.38", features = ["event", "process", "fs", "mount", "termios", "pipe", "stdio"] }
rusqlite = { version = "0.32", features = ["backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
clap_complete = "4"

[dev-dependencies]
libc = "0.2"
rusqlite = { version = "0.32" }
uuid = { version = "1", features = ["v4"] }
